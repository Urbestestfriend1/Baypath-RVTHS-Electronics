
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Class</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    header {
      padding: 60px 24px;
      text-align: center;
      background: #1f2937;
    }

    h1 {

<body>

    <p class="accent">YOUR CLASS • YOUR PROJECTS</p>
    <h1>Shop Class</h1>

  <main>
    <section class="panel">
      <h2>Welcome</h2>
      <p>Our new shop class website is under construction.</p>
      <p>Check back soon for projects, resources, and more.</p>
    </section>

</html>
